  var btn = document.createElement('button');
  btn.textContent = '🔇 Activar sonido';

  gd.parentNode.insertBefore(btn, gd);

  function elegirVoz() {
    var voces = window.speechSynthesis.getVoices();
    return voces.find(function (v) { return v.lang === 'es-CL'; }) ||
           voces.find(function (v) { return v.lang.indexOf('es') === 0; }) || null;
  }

  function hablar(texto) {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texto);
    var voz = elegirVoz();
    if (voz) { u.voice = voz; u.lang = voz.lang; } else { u.lang = 'es-ES'; }
    u.rate = 1.05;
    window.speechSynthesis.speak(u);
  }

  btn.addEventListener('click', function () {
    activo = !activo;
    btn.textContent = activo ? '🔊 Sonido activado' : '🔇 Activar sonido';
    if (activo) { hablar('Sonido activado'); } else { window.speechSynthesis.cancel(); }
  });

  gd.on('plotly_hover', function (ev) {
    if (!activo || !ev.points || !ev.points.length) return;
    var iso = ev.points[0].location;
    var d = datos[iso];
    if (!d || iso === ultimo) return;
    ultimo = iso;
    clearTimeout(timer);
    // pequena pausa para no hablar mientras el mouse solo "atraviesa" paises
    timer = setTimeout(function () { hablar(d.pais + ', ' + d.color); }, 120);
  });

  gd.on('plotly_unhover', function () {
    ultimo = null;
    clearTimeout(timer);
    window.speechSynthesis.cancel();
  });
})();
